# Deployment stack: postgres, web (gunicorn), worker, caddy.
# Local development adds bind mounts and published ports via docker-compose.override.yml
# (loaded automatically; use `-f docker-compose.yml` alone to ignore it).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fairrank}
      POSTGRES_USER: ${POSTGRES_USER:-fairrank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-fairrank}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fairrank}
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-fairrank}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fairrank}
    command: python manage.py run_worker
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv/app:ro
      - static:/srv/static:ro
      - caddy_data:/data
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pgdata:
  media:
  static:
  caddy_data:
